<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Dashboard — FindHouse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="bg-light">

    <header class="navbar">
        <div class="container nav-content">
            <a href="{{ url_for('main.home') }}" class="logo">🏠 Find<span>House</span> <small
                    style="font-size:0.75rem; color:#64748b;">Owner Portal</small></a>
            <div class="nav-actions">
                <a href="{{ url_for('main.home') }}" class="btn btn-outline" style="text-decoration:none;">← Back to
                    Tenant View</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 40px 20px;">
        <div class="features-grid" style="margin-bottom: 32px;">
            <div class="feature-card">
                <p style="color:#64748b; font-size:0.85rem;">Total Listed Properties</p>
                <h2 id="statTotalKos" style="font-size:2rem; color:#0f172a;">0</h2>
            </div>
            <div class="feature-card">
                <p style="color:#64748b; font-size:0.85rem;">Available Rooms</p>
                <h2 id="statAvailableRooms" style="font-size:2rem; color:#2563eb;">0</h2>
            </div>
            <div class="feature-card">
                <p style="color:#64748b; font-size:0.85rem;">Pending Booking Requests</p>
                <h2 id="statPendingBookings" style="font-size:2rem; color:#d97706;">0</h2>
            </div>
        </div>

        <div class="hero-grid" style="align-items: start;">
            <div>
                <div class="search-card" style="margin-bottom: 24px;">
                    <h3>+ Register New Boarding House</h3>
                    <form id="addKosForm">
                        <div class="form-group">
                            <label>Property Name</label>
                            <input type="text" id="newKosName" required placeholder="e.g., Kos Cendana Indah" />
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Location</label>
                                <input type="text" id="newKosLoc" required placeholder="e.g., Panam, Pekanbaru" />
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <select id="newKosType">
                                    <option value="Male">Male Only</option>
                                    <option value="Female">Female Only</option>
                                    <option value="Mixed">Mixed</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Monthly Price (IDR)</label>
                                <input type="number" id="newKosPrice" required placeholder="900000" />
                            </div>
                            <div class="form-group">
                                <label>Available Rooms</label>
                                <input type="number" id="newKosRooms" required min="1" value="3" />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Add Property</button>
                    </form>
                </div>

                <div class="search-card">
                    <h3>My Properties & Room Availability</h3>
                    <div id="ownerKosList" style="display:flex; flex-direction:column; gap:12px;"></div>
                </div>
            </div>

            <div class="search-card">
                <h3>Booking Requests & History</h3>
                <p style="font-size:0.85rem; color:#64748b; margin-bottom:16px;">Accept or reject incoming tenant room
                    bookings.</p>
                <div id="bookingList" style="display:flex; flex-direction:column; gap:14px;"></div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>

</html>
